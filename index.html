<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>비행기 슈팅 게임 - 1단계</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    <!-- 로그인 오버레이 UI -->
    <div id="loginScreen" class="overlay-screen">
      <div class="login-box">
        <h1>AIR FLYING</h1>
        <p>우주 전쟁에 참여하세요!</p>
        
        <div class="custom-login-form">
          <input type="text" id="customId" placeholder="아이디 (예: air123)" autocomplete="off">
          <input type="password" id="customPw" placeholder="비밀번호 (6자리 이상)" autocomplete="off">
          <button id="customLoginBtn">시작하기 (가입/로그인)</button>
        </div>

        <div class="divider">
          <span>또는</span>
        </div>

        <button id="googleLoginBtn">Google 계정으로 로그인</button>
      </div>
    </div>

    <!-- 격납고(비행기 선택) 오버레이 UI -->
    <div id="hangarScreen" class="overlay-screen hidden">
      <div class="hangar-box">
        <h1>격납고 (SELECT FIGHTER)</h1>
        <p>출격할 비행기를 선택하세요.</p>
        
        <div class="fighter-selection">
          <!-- 1번: 무료 비행기 -->
          <div class="fighter-card selected" id="basicFighterCard" data-type="basic">
            <div class="fighter-img-wrap">
              <img src="public/basic.png" alt="기본 비행기">
            </div>
            <h3>기본 전투기</h3>
            <span class="price">무료</span>
          </div>
          
          <!-- 2번: 유료 프리미엄 비행기 -->
          <div class="fighter-card locked" id="premiumFighterCard" data-type="premium">
            <div class="fighter-img-wrap">
              <img src="public/premium_01.png" alt="프리미엄 비행기">
              <div class="lock-overlay" id="premiumLockIcon">🔒</div>
            </div>
            <h3>황금 3D 전투기</h3>
            <span class="price premium-price">10,000원</span>
          </div>
        </div>

        <button id="startGameBtn">출격하기 (START GAME)</button>
      </div>
    </div>

    <!-- 게임 오버 오버레이 UI -->
    <div id="gameOverScreen" class="overlay-screen hidden">
      <h1>GAME OVER</h1>
      <p id="finalScore">최종 점수: 0점</p>
      <button id="restartBtn">재시작 (Restart)</button>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
