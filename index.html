<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>비행기 슈팅 게임 - 1단계</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <div class="game-container">
    <!-- 음소거 버튼 -->
    <button id="muteBtn" class="mute-btn" title="음소거 (Mute)">🔊</button>
    
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    
    <!-- 로그인 오버레이 UI -->
    <div id="loginScreen" class="overlay-screen">
      <div class="login-box">
        <h1>AIR FLYING</h1>
        <p>우주 전쟁에 참여하세요!</p>
        
        <div class="custom-login-form">
          <input type="text" id="customId" placeholder="아이디 (예: air123)" autocomplete="off">
          <input type="password" id="customPw" placeholder="비밀번호 (6자리 이상)" autocomplete="off">
          
          <div class="save-id-wrap">
            <input type="checkbox" id="saveIdCheck">
            <label for="saveIdCheck">아이디 저장</label>
          </div>

          <button id="customLoginBtn">시작하기 (가입/로그인)</button>
        </div>

        <div class="divider">
          <span>또는</span>
        </div>

        <button id="googleLoginBtn">Google 계정으로 로그인</button>
      </div>
    </div>

    <!-- 격납고(비행기 선택) 오버레이 UI -->
    <div id="hangarScreen" class="overlay-screen hidden">
      <div class="hangar-box">
        <h1>SELECT FIGHTER</h1>
        
        <div class="fighter-selection">
          <!-- 1번: 무료 비행기 (SF 홀로그램 스타일 가로형) -->
          <div class="fighter-card sci-fi-card selected" id="basicFighterCard" data-type="basic">
            <div class="fighter-img-wrap">
              <img src="public/basic.png" alt="기본 비행기">
            </div>
            <div class="card-info">
              <h3>BASIC FIGHTER</h3>
              <span class="price">Level 1 Standard</span>
            </div>
          </div>
          
          <!-- 2번: 프리미엄 비행기 (무중력 글래스모피즘 HUD 스타일, 거대 사각창) -->
          <div class="hud-glass-card" id="premiumFighterCard" data-type="premium">
            <div class="fighter-img-wrap">
              <img src="public/premium_01.png" alt="프리미엄 비행기">
            </div>
          </div>
        </div>
        <button id="startGameBtn">START GAME</button>
      </div>
    </div>

    <!-- 게임 오버 오버레이 UI -->
    <div id="gameOverScreen" class="overlay-screen hidden">
      <h1>GAME OVER</h1>
      <p id="finalScore">최종 점수: 0점</p>
      <button id="restartBtn">Select Fighter</button>
    </div>
  </div>
  <script type="module" src="game.js?v=3"></script>
</body>
</html>
