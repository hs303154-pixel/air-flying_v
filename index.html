<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>비행기 슈팅 게임 - 1단계</title>
  <link rel="stylesheet" href="style.css?v=11">
  <style>
    .mobile-item-btn {
      position: fixed !important;
      left: 20px !important;
      width: 70px;
      height: 70px;
      background: rgba(255, 50, 50, 0.7);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000 !important;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
      pointer-events: auto;
    }
    .mobile-item-btn:active {
      background: rgba(255, 0, 0, 0.9);
      transform: scale(0.95);
    }
    .mobile-item-btn.hidden {
      display: none !important;
    }
    #mobileBombBtn { bottom: 30px !important; }
    #mobileGunBtn { bottom: 120px !important; }
    #mobileShieldBtn { bottom: 210px !important; }
    /* 사용설명서 수평 정렬 오버라이드 */
    .stitch-fighter-info {
      justify-content: flex-start !important;
      gap: 50px !important; /* 텍스트를 원래 위치(밑)로 내림 */
    }
    .top-buttons-wrapper {
      display: flex;
      gap: 15px;
    }
    /* 버튼들 크기 고정 (글자수 달라도 무조건 똑같은 크기로 강제 고정) */
    .stitch-manual-btn, .stitch-shop-btn {
      padding: 12px 0 !important; 
      width: 110px !important;
      text-align: center !important;
      font-size: 13px !important;
    }
    /* 상점 버튼 스타일 */
    .stitch-shop-btn {
      background: rgba(255, 200, 0, 0.1);
      border: 1px solid #ffcc00;
      color: #ffcc00;
      font-family: 'Inter', sans-serif;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .stitch-shop-btn:hover {
      background: rgba(255, 200, 0, 0.3);
      box-shadow: 0 0 10px #ffcc00;
    }
    
    /* 상점 모달 스타일 */
    .stitch-shop-panel {
      background: rgba(10, 20, 30, 0.95);
      border: 2px solid #ffcc00;
      box-shadow: 0 0 20px rgba(255, 200, 0, 0.5);
      width: 320px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
    }
    .stitch-shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 200, 0, 0.5);
      padding-bottom: 10px;
    }
    .stitch-shop-header .stitch-title {
      color: #ffcc00;
      text-shadow: 0 0 8px #ffcc00;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #ffcc00;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .stitch-shop-body {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .shop-item-row {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 200, 0, 0.3);
      padding: 10px;
      gap: 10px;
    }
    .shop-item-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
    }
    .shop-item-desc {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .shop-item-name {
      color: white;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }
    .shop-item-detail {
      color: #aaa;
      font-size: 11px;
      line-height: 1.3;
    }
    .shop-buy-btn {
      background: rgba(255, 200, 0, 0.2);
      border: 1px solid #ffcc00;
      color: #ffcc00;
      padding: 8px 10px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .shop-buy-btn:hover {
      background: rgba(255, 200, 0, 0.5);
      box-shadow: 0 0 10px #ffcc00;
    }
  </style>
<body>
  <div class="game-container">
    <!-- 음소거 버튼 -->
    <button id="muteBtn" class="mute-btn" title="음소거 (Mute)">🔊</button>
    
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    
    <!-- 모바일 전용 폭탄 버튼 -->
    <button id="mobileBombBtn" class="mobile-item-btn hidden">
      <span style="font-size: 24px;">🚀</span>
      <span id="bombCountDisplay">0</span>
    </button>
    <!-- 모바일 전용 기관총 버튼 -->
    <button id="mobileGunBtn" class="mobile-item-btn hidden">
      <span style="font-size: 24px;">🔫</span>
      <span id="gunCountDisplay">0</span>
    </button>
    <!-- 모바일 전용 쉴드 버튼 -->
    <button id="mobileShieldBtn" class="mobile-item-btn hidden">
      <span style="font-size: 24px;">🛡️</span>
      <span id="shieldCountDisplay">0</span>
    </button>
    
    <!-- 로그인 오버레이 UI -->
    <div id="loginScreen" class="overlay-screen">
      <div class="login-box">
        <h1>AIR FLYING</h1>
        <p>우주 전쟁에 참여하세요!</p>
        
        <div class="custom-login-form">
          <input type="text" id="customId" placeholder="아이디 (예: air123)" autocomplete="off">
          <input type="password" id="customPw" placeholder="비밀번호 (6자리 이상)" autocomplete="off">
          
          <div class="save-id-wrap">
            <input type="checkbox" id="saveIdCheck">
            <label for="saveIdCheck">아이디 저장</label>
          </div>

          <button id="customLoginBtn">시작하기 (가입/로그인)</button>
        </div>

        <div class="divider">
          <span>또는</span>
        </div>

        <button id="googleLoginBtn">Google 계정으로 로그인</button>
      </div>
    </div>

    <!-- 격납고(비행기 선택) 오버레이 UI -->
    <div id="hangarScreen" class="overlay-screen hidden">
      <div class="stitch-hangar-panel">
        
        <!-- 상단 헤더 -->
        <div class="stitch-top-header">
          <div class="stitch-title">SELECT FIGHTER</div>
        </div>
        
        <!-- 중간 영역 (서브 창 + 기체 정보) -->
        <div class="stitch-middle-section">
          <!-- 상단 좌측 서브 창 -->
          <div class="stitch-sub-display">
            <img class="sub-fighter-img" src="public/basic.png" alt="기본 비행기">
          </div>
          <!-- 우측 기체 이름 및 정보 -->
          <div class="stitch-fighter-info">
            <div class="top-buttons-wrapper">
              <button class="stitch-manual-btn">사용설명서</button>
              <button class="stitch-shop-btn" id="openShopBtn">상점</button>
            </div>
            <div class="fighter-name">BASIC FIGHTER</div>
          </div>
        </div>
        
        <!-- 중앙 메인 디스플레이 -->
        <div class="stitch-main-display">
          <!-- 좌측 슬라이드 화살표 (뒤로가기) -->
          <div id="prevFighterBtn" class="stitch-nav-arrow left-arrow">&#9664;</div>
          <!-- 우측 슬라이드 화살표 -->
          <div id="nextFighterBtn" class="stitch-nav-arrow right-arrow">&#9654;</div>
          
        <!-- 우측 상단 자물쇠 아이콘 (테스트용 해제 상태) -->
          <div id="premiumLockIcon" class="stitch-lock-icon">🔓</div>
          
          <div class="stitch-center-hologram">
            <div class="fighter-img-wrap">
              <img id="currentFighterImg" src="public/premium_01.png" alt="프리미엄 전투기 1">
            </div>
            <!-- 불빛 삭제됨 -->
          </div>
        </div>



        <!-- 하단 네비게이션바 (결제 전용 단일 버튼) -->
        <div class="stitch-bottom-nav">
          <div class="nav-item active" id="startGameBtn" style="padding: 15px 0;">
            <span class="nav-text" style="font-size: 22px; font-weight: 900; color: #ff3366; text-shadow: 0 0 15px #ff3366; letter-spacing: 2px;">$6.99 결제 하기</span>
          </div>
        </div>
        
      </div>
    </div>

    <!-- 상점 팝업 모달창 (숨김 상태) -->
    <div id="shopScreen" class="overlay-screen hidden">
      <div class="stitch-shop-panel">
        <div class="stitch-shop-header">
          <span class="stitch-title">SHOP</span>
          <button id="closeShopBtn" class="close-btn">X</button>
        </div>
        <div class="stitch-shop-body">
          <!-- 1번째 줄: 기관총 -->
          <div class="shop-item-row">
            <img class="shop-item-img" src="public/GON_001.png" alt="Machine Gun">
            <div class="shop-item-desc">
              <div class="shop-item-name">기관총 (Machine Gun)</div>
              <div class="shop-item-detail">30초간 미친 연사 속도 폭발! (단축키: M)</div>
            </div>
            <button id="buyGunBtn" class="shop-buy-btn">500 G</button>
          </div>
          <!-- 2번째 줄: 폭탄 -->
          <div class="shop-item-row">
            <img class="shop-item-img" src="public/BUM_001.png" alt="Bomb">
            <div class="shop-item-desc">
              <div class="shop-item-name">폭탄 (Bomb)</div>
              <div class="shop-item-detail">화면 내 모든 적과 미사일 삭제! (단축키: B)</div>
            </div>
            <button id="buyBombBtn" class="shop-buy-btn">500 G</button>
          </div>
          <!-- 3번째 줄: 쉴드 -->
          <div class="shop-item-row">
            <img class="shop-item-img" src="public/SHL_001.png" alt="Shield">
            <div class="shop-item-desc">
              <div class="shop-item-name">쉴드 (Shield)</div>
              <div class="shop-item-detail">피격 시 1회 완벽 방어! (단축키: S)</div>
            </div>
            <button id="buyShieldBtn" class="shop-buy-btn">500 G</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 출격 확인 모달창 (숨김 상태) -->
    <div id="startModal" class="overlay-screen hidden">
      <div class="stitch-modal-panel">
        <div class="stitch-modal-header">SYSTEM READY</div>
        <div class="stitch-modal-body">
          <p id="modalFighterName">[ PREMIUM FIGHTER ]</p>
          <p class="modal-subtext">기체를 출격시키겠습니까?</p>
        </div>
        <div class="stitch-modal-footer">
          <button id="modalStartBtn" class="stitch-modal-btn confirm">START</button>
          <button id="modalCancelBtn" class="stitch-modal-btn cancel">CANCEL</button>
        </div>
      </div>
    </div>

    <!-- 게임 오버 오버레이 UI -->
    <div id="gameOverScreen" class="overlay-screen hidden">
      <h1>GAME OVER</h1>
      <p id="finalScore">최종 점수: 0점</p>
      <button id="restartBtn">Select Fighter</button>
    </div>
  </div>
  <script type="module" src="game.js?v=5"></script>
</body>
</html>
